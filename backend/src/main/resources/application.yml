spring:
  application:
    name: agentreview
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/agentreview}
    username: ${SPRING_DATASOURCE_USERNAME:agentreview}
    password: ${SPRING_DATASOURCE_PASSWORD:agentreview}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-6

jwt:
  secret: ${JWT_SECRET:agentreview-jwt-secret-change-in-production-min-32-chars}
  expiration-ms: 86400000

agentreview:
  analyzer:
    url: ${ANALYZER_URL:http://analyzer:8081}
  review:
    sync-max-lines: 300
    llm-max-code-chars: 16000
  reports:
    ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    eu.nexuslayer: INFO
