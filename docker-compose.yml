services:
  analyzer:
    build: ./analyzer
    ports:
      - "8201:8081"
    command: uvicorn main:app --host 0.0.0.0 --port 8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [agentreview]

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: agentreview
      MARIADB_USER: agentreview
      MARIADB_PASSWORD: ${DB_PASSWORD:-agentreview}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [agentreview]

  frontend:
    build: ./frontend
    ports:
      - "3200:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [agentreview]

volumes:
  db_data:
networks:
  agentreview:
    driver: bridge
